<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LLM 5h Limit Timeline</title>
<meta name="description" content="Plan cron triggers and heavy-use windows to burn Claude and Codex $20 plan quotas efficiently in a 48-hour hackathon.">
<style>
  :root {
    --bg: #0f1115;
    --card: #181b22;
    --line: #2a2f3a;
    --fg: #e8eaef;
    --dim: #8b93a7;
    --cron: #5fd3a6;
    --b1: #ff8a5c;
    --b2: #ffc857;
    --sleep: #242a38;
    --meal: #3a3224;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    font-variant-numeric: tabular-nums;
  }
  main {
    max-width: 1120px;
    margin: 0 auto;
    padding: 28px max(20px, env(safe-area-inset-right)) 48px max(20px, env(safe-area-inset-left));
  }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  label { display: block; color: var(--dim); font-size: 12px; margin-bottom: 6px; min-height: 32px; }
  .pair { display: flex; gap: 6px; }
  .pair input { flex: 1 1 auto; min-width: 0; }
  .pair select { flex: 0 0 84px; }
  input, select {
    width: 100%;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--fg);
    font: inherit;
    color-scheme: dark;
  }
  .wrap { margin-top: 22px; overflow-x: auto; -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain; }
  .tl { position: relative; }
  .date {
    position: absolute;
    font-size: 12px;
    color: var(--dim);
    white-space: nowrap;
  }
  .tml {
    position: absolute;
    transform: translateX(-50%);
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
  }
  .track { position: absolute; left: 0; right: 0; }
  .band { position: absolute; z-index: 1; }
  .date, .tml { z-index: 3; }
  .link, .burn, .dot, .tick { z-index: 2; }
  .band.sleep { background: var(--sleep); }
  .band.meal { background: var(--meal); }
  .band span {
    position: absolute;
    left: 2px; right: 2px;
    top: 3px;
    text-align: center;
    font-size: 10px;
    color: #9aa3b5;
  }
  .link { position: absolute; height: 2px; background: var(--cron); }
  .burn { position: absolute; border-radius: 5px; }
  .burn.b1 { background: var(--b1); }
  .burn.b2 { background: var(--b2); }
  .dot {
    position: absolute;
    width: 12px; height: 12px;
    margin: -6px 0 0 -6px;
    border-radius: 50%;
    background: var(--cron);
    box-shadow: 0 0 0 3px var(--bg);
    z-index: 2;
  }
  .tick { position: absolute; width: 1px; background: #3a4150; }
  .tick.major { background: #4a5160; }
  .dur {
    position: absolute;
    text-align: center;
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
  }
  .dur span { position: relative; }
  .prompts { margin-top: 22px; }
  .prompt { display: flex; gap: 16px; align-items: baseline; padding: 8px 0; border-top: 1px solid var(--line); }
  .when { flex: 0 0 148px; color: var(--cron); font-weight: 600; }
  .prompt p { margin: 0; user-select: all; }
  @media (max-width: 800px) {
    .grid { grid-template-columns: 1fr 1fr; }
    .prompt { flex-direction: column; gap: 4px; align-items: stretch; }
    .when { flex-basis: auto; }
  }
  @media (max-width: 640px) {
    main { padding: 16px max(16px, env(safe-area-inset-right)) calc(32px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
    .grid { grid-template-columns: 1fr; gap: 14px; }
    label { min-height: 0; }
    input, select { font-size: 16px; min-height: 44px; }
    .pair select { flex-basis: 104px; }
    .prompt { padding: 12px 0; }
    .prompt p { line-height: 1.45; }
    .wrap { margin-top: 18px; }
  }
</style>
</head>
<body>
<main>
  <div class="grid">
    <div>
      <label for="start">Start</label>
      <div class="pair"><input id="start" type="date"><select id="startTime" aria-label="Start time"></select></div>
    </div>
    <div>
      <label for="end">End</label>
      <div class="pair"><input id="end" type="date"><select id="endTime" aria-label="End time"></select></div>
    </div>
    <div>
      <label for="burn">Hours to burn one 5h quota</label>
      <input id="burn" type="number" value="1.5" min="0.25" max="4" step="0.25">
    </div>
    <div>
      <label for="cap">Weekly quota (× 5h)</label>
      <input id="cap" type="number" value="7.692" min="0.25" step="0.001">
    </div>
  </div>
  <div class="wrap" id="wrap"><div class="tl" id="tl"></div></div>
  <div class="prompts" id="prompts"></div>
</main>
<script>
const HOUR = 3600e3;
const STEP = 15 * 60e3;
const $ = id => document.getElementById(id);
const ctx = document.createElement("canvas").getContext("2d");

function measure(text, font) {
  ctx.font = font;
  return ctx.measureText(text).width;
}
function hhmm(t) {
  const d = new Date(t);
  return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
}
function dayLabel(t) {
  return new Date(t).toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
}
function stamp(t) {
  const d = new Date(t);
  const date = d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
  return `${date}, ${hhmm(t)}`;
}
function hoursText(ms) {
  const h = Math.round(ms / HOUR * 100) / 100;
  return `${h}h`;
}
function blocked(t) {
  const d = new Date(t);
  const m = d.getHours() * 60 + d.getMinutes();
  return m < 360 || (m >= 720 && m < 780) || (m >= 1080 && m < 1140);
}
function free(a, b) {
  for (let t = a; t < b; t += STEP) if (blocked(t)) return false;
  return true;
}
function kind(t) {
  const h = new Date(t).getHours();
  if (h < 6) return "sleep";
  if (h >= 12 && h < 13) return "lunch";
  return "dinner";
}
function plan(S, E, burnH, cap) {
  const b = burnH * HOUR;
  const rounds = [];
  let used = 0;
  let prevReset = -Infinity;
  let cursor = S;
  while (used < cap - 1e-6 && rounds.length < 24) {
    const left = cap - used;
    const w1 = Math.min(1, left);
    let w2 = Math.min(1, left - w1);
    if (w2 < 1e-6) w2 = 0;
    const dur1 = w1 * b;
    const dur2 = w2 * b;
    const total = dur1 + dur2;
    let earliest = cursor;
    if (prevReset > -Infinity) {
      earliest = Math.max(earliest, w2 > 0 ? prevReset + 10 * HOUR - dur1 : prevReset + 5 * HOUR);
    }
    let t = Math.ceil((earliest - 1e-6) / STEP) * STEP;
    let found = null;
    for (; t + total <= E + 1; t += STEP) {
      if (free(t, t + total)) { found = t; break; }
    }
    if (found == null) break;
    const reset = found + dur1;
    rounds.push({
      cron: w2 > 0 ? reset - 5 * HOUR : found,
      start: found,
      reset,
      end: found + total,
      dur1,
      dur2,
      w: w1 + w2
    });
    used += w1 + w2;
    prevReset = reset;
    cursor = found + total;
  }
  return rounds;
}

function pack(items, allowNew) {
  const lanes = [];
  const sorted = items.slice().sort((a, b) => a.x - b.x);
  for (const it of sorted) {
    const left = it.x - it.w / 2;
    const right = it.x + it.w / 2;
    let lane = 0;
    for (; lane < lanes.length; lane++) {
      if (lanes[lane].every(o => right < o.l - 6 || left > o.r + 6)) break;
    }
    if (lane === lanes.length && !allowNew) { it.lane = -1; continue; }
    if (!lanes[lane]) lanes[lane] = [];
    lanes[lane].push({ l: left, r: right });
    it.lane = lane;
  }
  return lanes.length;
}

function render() {
  const S = new Date(`${$("start").value}T${$("startTime").value}`).getTime();
  const E = new Date(`${$("end").value}T${$("endTime").value}`).getTime();
  const burnH = Math.min(4, Math.max(0.25, +$("burn").value || 1.5));
  const cap = Math.max(0.25, +$("cap").value || 7.692);
  const tl = $("tl");
  const prompts = $("prompts");
  if (!(E > S)) { tl.innerHTML = ""; prompts.innerHTML = ""; return; }

  const rounds = plan(S, E, burnH, cap);
  let t0 = S;
  let t1 = E;
  if (rounds.length) t0 = Math.min(t0, rounds[0].cron);
  t0 -= 1.5 * HOUR;
  t1 += HOUR;
  const span = t1 - t0;
  const wrapW = $("wrap").clientWidth || 800;
  const width = wrapW < 720 ? Math.max(wrapW, Math.ceil(span / HOUR * 22)) : Math.max(wrapW, 640);
  const xOf = t => (t - t0) / span * width;

  const font = '600 12px system-ui, -apple-system, "Segoe UI", sans-serif';
  const events = [];
  rounds.forEach(r => {
    events.push({ t: r.cron, text: hhmm(r.cron), color: "var(--cron)" });
    events.push({ t: r.start, text: hhmm(r.start), color: "var(--b1)" });
    if (r.dur2 > 0) events.push({ t: r.reset, text: hhmm(r.reset), color: "var(--fg)" });
    events.push({ t: r.end, text: hhmm(r.end), color: r.dur2 > 0 ? "var(--b2)" : "var(--b1)" });
  });
  events.forEach(e => { e.x = xOf(e.t); e.w = measure(e.text, font); });
  const timeLanes = pack(events, true);

  const grid = [];
  const origin = new Date(t0);
  origin.setMinutes(0, 0, 0);
  const oh = origin.getHours();
  origin.setHours(oh + (6 - oh % 6) % 6);
  if (origin.getTime() < t0) origin.setHours(origin.getHours() + 6);
  for (let t = origin.getTime(); t <= t1; t += 6 * HOUR) {
    const x = xOf(t);
    if (events.some(e => Math.abs(e.x - x) < 30)) continue;
    const text = hhmm(t);
    grid.push({ t, text, x, w: measure(text, font), color: "var(--dim)" });
  }
  const gridLanes = [];
  events.forEach(e => {
    if (!gridLanes[e.lane]) gridLanes[e.lane] = [];
    gridLanes[e.lane].push({ l: e.x - e.w / 2, r: e.x + e.w / 2 });
  });
  grid.forEach(g => {
    const left = g.x - g.w / 2, right = g.x + g.w / 2;
    let lane = 0;
    for (; lane < timeLanes; lane++) {
      const occ = gridLanes[lane] || [];
      if (occ.every(o => right < o.l - 6 || left > o.r + 6)) {
        occ.push({ l: left, r: right });
        gridLanes[lane] = occ;
        g.lane = lane;
        break;
      }
    }
    if (g.lane == null) g.lane = -1;
  });

  const durs = [];
  const pushDur = (a, b, text, color) => {
    durs.push({ a, b, text, color, x: (xOf(a) + xOf(b)) / 2, w: measure(text, font) + 8 });
  };
  rounds.forEach(r => {
    if (r.start - r.cron > 60e3) pushDur(r.cron, r.start, hoursText(r.start - r.cron), "var(--cron)");
    const t1 = hoursText(r.dur1);
    const t2 = r.dur2 > 0 ? hoursText(r.dur2) : "";
    const s1 = xOf(r.reset) - xOf(r.start);
    const s2 = r.dur2 > 0 ? xOf(r.end) - xOf(r.reset) : 0;
    const w1 = measure(t1, font) + 10;
    const w2 = t2 ? measure(t2, font) + 10 : 0;
    if (!t2 || (s1 >= w1 && s2 >= w2)) {
      pushDur(r.start, r.reset, t1, "var(--b1)");
      if (t2) pushDur(r.reset, r.end, t2, "var(--b2)");
    } else {
      const both = `${t1} + ${t2}`;
      const spanW = xOf(r.end) - xOf(r.start);
      pushDur(r.start, r.end, spanW >= measure(both, font) + 10 ? both : hoursText(r.dur1 + r.dur2), "var(--fg)");
    }
  });
  durs.forEach(d => {
    d.x = (xOf(d.a) + xOf(d.b)) / 2;
    d.w = measure(d.text, font) + 8;
  });
  const durLanes = durs.length ? pack(durs, true) : 1;

  const dateH = 22;
  const laneH = 18;
  const timeH = Math.max(1, timeLanes) * laneH + 8;
  const trackH = 44;
  const durH = Math.max(1, durLanes) * laneH + 10;
  const trackTop = dateH + timeH;
  tl.style.width = width + "px";
  tl.style.height = (trackTop + trackH + durH + (wrapW < 720 ? 18 : 0)) + "px";

  const html = [];
  const day0 = new Date(t0);
  day0.setHours(0, 0, 0, 0);
  for (let t = day0.getTime(); t < t1; t = new Date(new Date(t).setDate(new Date(t).getDate() + 1)).getTime()) {
    const a = Math.max(t, t0);
    if (a >= t1) continue;
    const text = dayLabel(t);
    const lw = measure(text, font);
    let left = xOf(a);
    if (left + lw > width - 2) left = Math.max(0, width - lw - 2);
    html.push(`<div class="date" style="left:${left}px;top:2px">${text}</div>`);
  }

  const first = new Date(t0);
  first.setMinutes(0, 0, 0);
  if (first.getTime() < t0) first.setHours(first.getHours() + 1);
  for (let t = first.getTime(); t <= t1; t += HOUR) {
    const major = new Date(t).getHours() % 6 === 0;
    html.push(`<div class="tick${major ? " major" : ""}" style="left:${xOf(t)}px;top:${trackTop}px;height:${major ? 10 : 5}px"></div>`);
  }

  let band = null;
  const flush = end => {
    if (!band) return;
    const left = xOf(band.s);
    const w = xOf(end) - left;
    const name = band.k === "sleep" ? "Sleep" : band.k === "lunch" ? "Lunch" : "Dinner";
    const tw = measure(name, "10px system-ui");
    let label = "";
    if (tw + 8 < w) {
      const dots = rounds.map(r => r.cron).filter(t => t > band.s && t < end);
      if (!dots.length) label = `<span>${name}</span>`;
      else {
        const dx = xOf(dots[0]) - left;
        const leftRoom = dx - 14;
        const rightRoom = w - dx - 14;
        if (Math.max(leftRoom, rightRoom) > tw) {
          const onLeft = leftRoom >= rightRoom;
          const x = onLeft ? Math.max(2, (leftRoom - tw) / 2) : dx + 14 + Math.max(0, (rightRoom - tw) / 2);
          label = `<span style="left:${x}px;right:auto;width:${tw + 2}px">${name}</span>`;
        }
      }
    }
    html.push(`<div class="band ${band.k === "sleep" ? "sleep" : "meal"}" style="left:${left}px;width:${w}px;top:${trackTop}px;height:${trackH}px">${label}</div>`);
    band = null;
  };
  for (let t = Math.ceil(t0 / STEP) * STEP; t < t1; t += STEP) {
    if (blocked(t)) {
      const k = kind(t);
      if (!band) band = { s: t, k };
      else if (band.k !== k) { flush(t); band = { s: t, k }; }
    } else flush(t);
  }
  flush(t1);

  rounds.forEach(r => {
    const bh = 28;
    const by = trackTop + (trackH - bh) / 2;
    const y = by + bh / 2;
    if (r.start > r.cron) {
      html.push(`<div class="link" style="left:${xOf(r.cron)}px;width:${xOf(r.start) - xOf(r.cron)}px;top:${y - 1}px"></div>`);
    }
    const x1 = xOf(r.start), x2 = xOf(r.reset), x3 = xOf(r.end);
    html.push(`<div class="burn b1" style="left:${x1}px;width:${Math.max(2, (r.dur2 > 0 ? x2 - 1 : x3) - x1)}px;top:${by}px;height:${bh}px"></div>`);
    if (r.dur2 > 0) {
      html.push(`<div class="burn b2" style="left:${x2 + 1}px;width:${Math.max(2, x3 - x2 - 1)}px;top:${by}px;height:${bh}px"></div>`);
    }
    html.push(`<div class="dot" style="left:${xOf(r.cron)}px;top:${y}px"></div>`);
  });

  events.forEach(e => {
    const top = dateH + (timeLanes - 1 - e.lane) * laneH;
    html.push(`<div class="tml" style="left:${e.x}px;top:${top}px;color:${e.color}">${e.text}</div>`);
  });
  grid.forEach(g => {
    if (g.lane < 0) return;
    const top = dateH + (timeLanes - 1 - g.lane) * laneH;
    html.push(`<div class="tml" style="left:${g.x}px;top:${top}px;color:${g.color};font-weight:500">${g.text}</div>`);
  });

  durs.forEach(d => {
    const top = trackTop + trackH + 8 + d.lane * laneH;
    html.push(`<div class="dur" style="left:${xOf(d.a)}px;width:${Math.max(1, xOf(d.b) - xOf(d.a))}px;top:${top}px;color:${d.color}"><span>${d.text}</span></div>`);
  });

  const track = `<div class="track" style="top:${trackTop}px;height:${trackH}px"></div>`;
  tl.innerHTML = track + html.join("");

  prompts.innerHTML = rounds.map(r => {
    return `<div class="prompt"><div class="when">${stamp(r.cron)}</div><p>Use the cheapest model. Reply "hi" and nothing else.</p></div>`;
  }).join("");
}

function init() {
  const s = new Date();
  s.setHours(10, 0, 0, 0);
  const pad = n => String(n).padStart(2, "0");
  const date = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const time = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  let options = "";
  for (let m = 0; m < 1440; m += 15) {
    const v = `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
    options += `<option value="${v}">${v}</option>`;
  }
  $("startTime").innerHTML = options;
  $("endTime").innerHTML = options;
  const e = new Date(s.getTime() + 48 * HOUR);
  $("start").value = date(s);
  $("startTime").value = time(s);
  $("end").value = date(e);
  $("endTime").value = time(e);
  document.querySelectorAll("input, select").forEach(el => el.addEventListener("input", render));
  new ResizeObserver(render).observe($("wrap"));
  render();
}
init();
</script>
</body>
</html>
